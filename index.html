<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Thermoshop — Отопление и сантехника</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #12181F;
    --surface: #1B232C;
    --surface-2: #232D38;
    --line: #2C3744;
    --copper: #D4622A;
    --copper-dim: #B2521F;
    --teal: #4F8A9C;
    --text: #F2EFE9;
    --text-dim: #93A0AC;
    --text-faint: #5F6B78;
    --radius: 10px;
    --safe-t: env(safe-area-inset-top, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  html { scroll-padding-top: var(--safe-t); }
  body {
    padding-top: var(--safe-t);
    padding-bottom: var(--safe-b);
  }
  h1, h2, h3, .display {
    font-family: 'Archivo', sans-serif;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin: 0;
  }

  /* ---------- Header ---------- */
  .topbar {
    position: sticky;
    top: var(--safe-t);
    z-index: 20;
    background: rgba(18,24,31,0.92);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
    padding: 10px 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .brand-mark {
    width: 38px; height: 38px;
    border-radius: 8px;
    background: #fff;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    overflow: hidden;
  }
  .brand-mark img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .brand-logo {
    background: #fff;
    border-radius: 10px;
    padding: 4px 8px;
    height: 68px;
    display: flex; align-items: center;
  }
  .brand-logo img { height: 100%; width: auto; display: block; }
  .brand-name { font-size: 17px; font-weight: 700; font-family: 'Archivo', sans-serif; }
  .brand-sub { font-size: 11px; color: var(--text-dim); margin-top: 1px; }

  .cart-btn {
    position: relative;
    width: 40px; height: 40px;
    border-radius: 9px;
    background: var(--surface-2);
    border: 1px solid var(--line);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  .cart-count {
    position: absolute;
    top: -6px; right: -6px;
    background: var(--copper);
    color: #fff;
    font-size: 11px;
    font-weight: 700;
    min-width: 18px; height: 18px;
    border-radius: 9px;
    display: flex; align-items: center; justify-content: center;
    padding: 0 4px;
  }

  /* ---------- Hero ---------- */
  .hero {
    padding: 22px 18px 8px;
  }
  .hero-eyebrow {
    display: flex; align-items: center; gap: 8px;
    color: var(--teal);
    font-size: 13px;
    margin-bottom: 10px;
  }
  .hero-eyebrow .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: #5FBF7A;
  }
  .hero h1 {
    font-size: 25px;
    line-height: 1.25;
    max-width: 23ch;
  }
  .hero p {
    color: var(--text-dim);
    font-size: 14px;
    line-height: 1.5;
    margin: 10px 0 0;
    max-width: 38ch;
  }

  /* ---------- Category pills ---------- */
  .cats {
    display: flex;
    gap: 8px;
    padding: 16px 18px;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .cats::-webkit-scrollbar { display: none; }
  .pill {
    flex-shrink: 0;
    padding: 8px 15px;
    border-radius: 100px;
    background: var(--surface);
    border: 1px solid var(--line);
    color: var(--text-dim);
    font-size: 13.5px;
    font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
  }
  .pill.active {
    background: var(--copper);
    border-color: var(--copper);
    color: #fff;
  }

  /* ---------- Product grid ---------- */
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    padding: 4px 18px 18px;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .card-art {
    aspect-ratio: 1.2;
    background: var(--surface-2);
    display: flex; align-items: center; justify-content: center;
    color: var(--teal);
    border-bottom: 1px solid var(--line);
  }
  .card-art svg { width: 44%; height: 44%; }
  .card-body { padding: 11px 12px 12px; display: flex; flex-direction: column; gap: 4px; flex: 1; }
  .card-brand { font-size: 10.5px; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.04em; }
  .card-name { font-size: 13.5px; font-weight: 600; line-height: 1.3; min-height: 2.6em; }
  .card-foot { display: flex; align-items: center; justify-content: space-between; margin-top: 6px; }
  .card-price { font-size: 14.5px; font-weight: 700; font-family: 'Archivo', sans-serif; }
  .add-btn {
    width: 30px; height: 30px;
    border-radius: 8px;
    background: var(--copper);
    color: #fff;
    border: none;
    font-size: 18px;
    line-height: 1;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  .add-btn.in-cart { background: var(--teal); }

  /* ---------- Contact strip ---------- */
  .contact-strip {
    margin: 10px 18px 24px;
    padding: 16px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .contact-row { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--text-dim); }
  .contact-row svg { width: 16px; height: 16px; color: var(--teal); flex-shrink: 0; }

  /* ---------- Cart drawer ---------- */
  .overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.5);
    opacity: 0; pointer-events: none;
    transition: opacity 0.2s;
    z-index: 30;
  }
  .overlay.open { opacity: 1; pointer-events: auto; }
  .drawer {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    max-height: 82vh;
    background: var(--bg);
    border-top: 1px solid var(--line);
    border-radius: 18px 18px 0 0;
    transform: translateY(100%);
    transition: transform 0.25s ease;
    z-index: 31;
    display: flex;
    flex-direction: column;
    padding-bottom: calc(var(--safe-b) + 14px);
  }
  .drawer.open { transform: translateY(0); }
  .drawer-handle { width: 36px; height: 4px; background: var(--line); border-radius: 2px; margin: 10px auto 2px; }
  .drawer-head { padding: 10px 18px 14px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--line); }
  .drawer-items { overflow-y: auto; padding: 8px 18px; flex: 1; }
  .cart-row { display: flex; align-items: center; gap: 10px; padding: 11px 0; border-bottom: 1px solid var(--line); }
  .cart-row:last-child { border-bottom: none; }
  .cart-row-name { font-size: 13.5px; font-weight: 600; flex: 1; }
  .cart-row-price { font-size: 12.5px; color: var(--text-dim); }
  .qty-ctrl { display: flex; align-items: center; gap: 8px; }
  .qty-btn {
    width: 26px; height: 26px; border-radius: 7px;
    background: var(--surface-2); border: 1px solid var(--line); color: var(--text);
    font-size: 15px; display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .qty-val { font-size: 13px; font-weight: 600; min-width: 16px; text-align: center; }

  .drawer-empty { padding: 40px 18px; text-align: center; color: var(--text-faint); font-size: 13.5px; }

  .drawer-foot { padding: 14px 18px 4px; border-top: 1px solid var(--line); }
  .total-row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px; }
  .total-label { font-size: 13px; color: var(--text-dim); }
  .total-val { font-size: 19px; font-weight: 700; font-family: 'Archivo', sans-serif; }
  .checkout-btn {
    width: 100%;
    padding: 14px;
    border-radius: var(--radius);
    background: var(--copper);
    color: #fff;
    border: none;
    font-size: 15px;
    font-weight: 600;
    font-family: 'Inter', sans-serif;
    cursor: pointer;
  }
  .checkout-btn:disabled { background: var(--surface-2); color: var(--text-faint); }

  .note {
    text-align: center;
    color: var(--text-faint);
    font-size: 11.5px;
    padding: 10px 24px 4px;
  }

  .card { cursor: pointer; }
  .card-art.has-img { background: #fff; padding: 6px; }
  .card-art.has-img img { width: 100%; height: 100%; object-fit: contain; display: block; }

  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0;
    max-height: 90vh;
    background: var(--bg);
    border-top: 1px solid var(--line);
    border-radius: 18px 18px 0 0;
    transform: translateY(100%);
    transition: transform 0.25s ease;
    z-index: 41;
    display: flex; flex-direction: column;
    padding-bottom: calc(var(--safe-b) + 14px);
  }
  .sheet.open { transform: translateY(0); }
  .sheet-overlay { z-index: 40; }
  .sheet-scroll { overflow-y: auto; padding: 0 18px 8px; }
  .sheet-img { background: #fff; border-radius: var(--radius); padding: 10px; margin-top: 4px; }
  .sheet-img img { width: 100%; max-height: 240px; object-fit: contain; display: block; }
  .sheet-img.icon { background: var(--surface-2); color: var(--teal); display: flex; justify-content: center; padding: 28px; }
  .sheet-img.icon svg { width: 90px; height: 90px; }
  .sheet-brand { font-size: 11px; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.05em; margin-top: 14px; }
  .sheet-name { font-size: 19px; margin-top: 4px; line-height: 1.25; }
  .sheet-price { font-size: 22px; font-weight: 700; font-family: 'Archivo', sans-serif; color: var(--copper); margin-top: 8px; }
  .specs { margin-top: 14px; border-top: 1px solid var(--line); }
  .spec-row { display: flex; justify-content: space-between; gap: 14px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
  .spec-row span:first-child { color: var(--text-dim); flex: 1.1; }
  .spec-row span:last-child { text-align: right; flex: 1; font-weight: 500; }
  .sheet-foot { padding: 12px 18px 0; border-top: 1px solid var(--line); }

  .splash {
    position: fixed; inset: 0; z-index: 100;
    background: #fff;
    display: flex; align-items: center; justify-content: center;
    animation: splash-out 0.45s ease 1.1s forwards;
  }
  .splash img { width: min(46vw, 200px); height: auto; animation: splash-in 0.5s ease both; }
  @keyframes splash-in { from { opacity: 0; transform: scale(0.92); } to { opacity: 1; transform: scale(1); } }
  @keyframes splash-out { to { opacity: 0; visibility: hidden; } }

  .top-actions { display: flex; align-items: center; gap: 8px; }
  .lang-btn {
    height: 40px; min-width: 46px; padding: 0 11px;
    border-radius: 9px; background: var(--surface-2); border: 1px solid var(--line);
    display: flex; align-items: center; justify-content: center; gap: 5px;
    font-size: 13px; font-weight: 700; font-family: 'Archivo', sans-serif; cursor: pointer;
  }
  .lang-btn svg { width: 14px; height: 14px; color: var(--teal); }
  .lang-list { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
  .lang-opt { display: flex; align-items: center; justify-content: space-between; padding: 15px 16px; font-size: 15px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .lang-opt:last-child { border-bottom: none; }
  .lang-opt .tick { color: var(--copper); font-weight: 700; visibility: hidden; }
  .lang-opt.sel .tick { visibility: visible; }
</style>
</head>

<script>
const tg = window.Telegram ? window.Telegram.WebApp : null;
if (tg) {
  tg.ready(); tg.expand();
  try { tg.setHeaderColor('#ffffff'); tg.setBackgroundColor('#ffffff'); } catch (e) {}
  setTimeout(() => { try { tg.setHeaderColor('#12181F'); tg.setBackgroundColor('#12181F'); } catch (e) {} }, 1100);
}

// ---------------- ПРИМЕРНЫЕ ТОВАРЫ — замените на реальные ----------------
const ICONS = {
  heater: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="6" y="2" width="12" height="20" rx="3"/><path d="M9 7h6M9 11h6M9 15h6"/></svg>`,
  boiler: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="4" y="3" width="16" height="18" rx="2"/><circle cx="9" cy="8" r="1.4"/><circle cx="15" cy="8" r="1.4"/><path d="M7 13h10M7 17h6"/></svg>`,
  pump: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="13" r="7"/><path d="M12 6V2M9 2h6M9 13l2-3 2 5 2-2"/></svg>`,
};

// Mahsulotlar products.js faylida
// ---------------------------------------------------------------------------

const I18N = {
  ru: {
    hours: 'Работаем сегодня, 9:00–18:00',
    h1: 'Котлы, насосы и водонагреватели с доставкой по Ташкенту',
    sub: 'Оригинальные Ariston, Grundfos, DAB, Navien и другие бренды. Выберите товар — оформим заказ прямо здесь.',
    address: 'Ташкент, Алмазарский район, ул. Ширака, 2',
    cat_all: 'Все товары', cat_heaters: 'Водонагреватели', cat_boilers: 'Котлы', cat_pumps: 'Насосы',
    cart: 'Корзина', total: 'Итого', checkout: 'Оформить заказ', add_cart: 'В корзину',
    note: 'Заказ будет отправлен менеджеру в Telegram',
    empty: 'Корзина пока пуста.<br>Добавьте товары из каталога.',
    cur: 'сум', sending: 'Отправляем...', lang_title: 'Язык', save: 'Сохранить',
    ok: 'Заказ принят! Скоро с вами свяжется менеджер.',
    fail: 'Не удалось отправить заказ. Попробуйте ещё раз или позвоните: +998 90 902 88 33',
  },
  uz: {
    hours: 'Bugun ishlaymiz, 9:00–18:00',
    h1: "Qozonlar, nasoslar va suv isitgichlar Toshkent bo'ylab yetkazib berish bilan",
    sub: "Original Ariston, Grundfos, DAB, Navien va boshqa brendlar. Mahsulotni tanlang — buyurtmani shu yerning o'zida rasmiylashtiramiz.",
    address: "Toshkent, Olmazor tumani, Shiroq ko'chasi, 2-uy",
    cat_all: 'Barcha mahsulotlar', cat_heaters: 'Suv isitgichlar', cat_boilers: 'Qozonlar', cat_pumps: 'Nasoslar',
    cart: 'Savat', total: 'Jami', checkout: 'Buyurtma berish', add_cart: 'Savatga',
    note: 'Buyurtma Telegram orqali menejerga yuboriladi',
    empty: "Savat hozircha bo'sh.<br>Katalogdan mahsulot qo'shing.",
    cur: "so'm", sending: 'Yuborilmoqda...', lang_title: 'Til', save: 'Saqlash',
    ok: "Buyurtma qabul qilindi! Tez orada menejer siz bilan bog'lanadi.",
    fail: "Buyurtmani yuborib bo'lmadi. Qayta urinib ko'ring yoki qo'ng'iroq qiling: +998 90 902 88 33",
  },
  en: {
    hours: 'Open today, 9:00–18:00',
    h1: 'Boilers, pumps and water heaters delivered across Tashkent',
    sub: 'Original Ariston, Grundfos, DAB, Navien and other brands. Pick a product and place your order right here.',
    address: '2 Shiraq St, Olmazor district, Tashkent',
    cat_all: 'All products', cat_heaters: 'Water heaters', cat_boilers: 'Boilers', cat_pumps: 'Pumps',
    cart: 'Cart', total: 'Total', checkout: 'Place order', add_cart: 'Add to cart',
    note: 'Your order will be sent to the manager in Telegram',
    empty: 'Your cart is empty.<br>Add items from the catalog.',
    cur: 'UZS', sending: 'Sending...', lang_title: 'Language', save: 'Save',
    ok: 'Order received! A manager will contact you soon.',
    fail: "Couldn't send the order. Try again or call: +998 90 902 88 33",
  },
};
const LANGS = [
  { id: 'uz', label: "O'zbek tili", short: 'UZ' },
  { id: 'ru', label: 'Русский язык', short: 'RU' },
  { id: 'en', label: 'English', short: 'EN' },
];
function detectLang() {
  try { const sv = localStorage.getItem('ts_lang'); if (sv && I18N[sv]) return sv; } catch (e) {}
  const c = ((tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.language_code) || navigator.language || 'ru').toLowerCase();
  if (c.startsWith('uz')) return 'uz';
  if (c.startsWith('en')) return 'en';
  return 'ru';
}
let lang = detectLang();
const t = (k) => (I18N[lang] && I18N[lang][k]) || I18N.ru[k] || k;
const trL = (x, l) => (x && typeof x === 'object') ? (x[l] || x.ru || '') : x;
const tr = (x) => trL(x, lang);

const CATS = [
  { id: 'all' }, { id: 'heaters' }, { id: 'boilers' }, { id: 'pumps' },
];

// Railway'dagi bot havolasi (oxirida / belgisiz). Masalan: https://thermoshop-app1-production.up.railway.app
const API_URL = '';

let activeCat = 'all';
let cart = {}; // id -> qty

function fmt(n) { return n.toLocaleString('ru-RU') + ' ' + t('cur'); }

function renderCats() {
  const el = document.getElementById('cats');
  el.innerHTML = CATS.map(c =>
    `<div class="pill ${c.id === activeCat ? 'active' : ''}" data-cat="${c.id}">${t('cat_' + c.id)}</div>`
  ).join('');
  el.querySelectorAll('.pill').forEach(p => p.onclick = () => { activeCat = p.dataset.cat; renderCats(); renderGrid(); });
}

function renderGrid() {
  const el = document.getElementById('grid');
  const items = PRODUCTS.filter(p => activeCat === 'all' || p.cat === activeCat);
  el.innerHTML = items.map(p => `
    <div class="card" data-card="${p.id}">
      <div class="card-art ${p.img ? 'has-img' : ''}">${p.img ? `<img src="${p.img}" alt="${tr(p.name)}" loading="lazy">` : ICONS[p.icon]}</div>
      <div class="card-body">
        <div class="card-brand">${p.brand}</div>
        <div class="card-name">${tr(p.name)}</div>
        <div class="card-foot">
          <div class="card-price">${fmt(p.price)}</div>
          <button class="add-btn ${cart[p.id] ? 'in-cart' : ''}" data-id="${p.id}">${cart[p.id] ? '✓' : '+'}</button>
        </div>
      </div>
    </div>
  `).join('');
  el.querySelectorAll('.card').forEach(c => c.onclick = () => openSheet(Number(c.dataset.card)));
  el.querySelectorAll('.add-btn').forEach(b => b.onclick = (e) => {
    e.stopPropagation();
    const id = Number(b.dataset.id);
    cart[id] = (cart[id] || 0) + 1;
    renderGrid(); renderCartUI();
    if (tg) tg.HapticFeedback.impactOccurred('light');
  });
}

function cartTotal() {
  return Object.entries(cart).reduce((sum, [id, qty]) => {
    const p = PRODUCTS.find(x => x.id === Number(id));
    return sum + (p ? p.price * qty : 0);
  }, 0);
}
function cartCount() {
  return Object.values(cart).reduce((a, b) => a + b, 0);
}

function renderCartUI() {
  const count = cartCount();
  const countEl = document.getElementById('cartCount');
  countEl.style.display = count ? 'flex' : 'none';
  countEl.textContent = count;

  const itemsEl = document.getElementById('drawerItems');
  const entries = Object.entries(cart).filter(([,q]) => q > 0);
  if (!entries.length) {
    itemsEl.innerHTML = `<div class="drawer-empty">${t('empty')}</div>`;
  } else {
    itemsEl.innerHTML = entries.map(([id, qty]) => {
      const p = PRODUCTS.find(x => x.id === Number(id));
      return `
        <div class="cart-row">
          <div style="flex:1">
            <div class="cart-row-name">${tr(p.name)}</div>
            <div class="cart-row-price">${fmt(p.price)}</div>
          </div>
          <div class="qty-ctrl">
            <button class="qty-btn" data-act="dec" data-id="${id}">−</button>
            <span class="qty-val">${qty}</span>
            <button class="qty-btn" data-act="inc" data-id="${id}">+</button>
          </div>
        </div>`;
    }).join('');
    itemsEl.querySelectorAll('.qty-btn').forEach(b => b.onclick = () => {
      const id = b.dataset.id;
      if (b.dataset.act === 'inc') cart[id] = (cart[id] || 0) + 1;
      else { cart[id] = (cart[id] || 0) - 1; if (cart[id] <= 0) delete cart[id]; }
      renderGrid(); renderCartUI();
    });
  }

  document.getElementById('totalVal').textContent = fmt(cartTotal());
  document.getElementById('checkoutBtn').disabled = !entries.length;
}

// Drawer open/close
const overlay = document.getElementById('overlay');
const drawer = document.getElementById('drawer');
function openDrawer() { overlay.classList.add('open'); drawer.classList.add('open'); }
function closeDrawer() { overlay.classList.remove('open'); drawer.classList.remove('open'); }
document.getElementById('cartBtn').onclick = openDrawer;
document.getElementById('closeDrawer').onclick = closeDrawer;
overlay.onclick = closeDrawer;

// Checkout → send order to bot via Telegram WebApp, or fallback link
document.getElementById('checkoutBtn').onclick = () => {
  const entries = Object.entries(cart).filter(([,q]) => q > 0);
  if (!entries.length) return;
  const lines = entries.map(([id, qty]) => {
    const p = PRODUCTS.find(x => x.id === Number(id));
    return `${trL(p.name, 'ru')} × ${qty} — ${p.price * qty} сум`;
  });
  const orderText = `Новый заказ Thermoshop:\n\n${lines.join('\n')}\n\nИтого: ${cartTotal()} сум\nЯзык клиента: ${lang}`;

  const payload = { items: entries.map(([id, qty]) => ({ id: Number(id), qty })), total: cartTotal(), text: orderText };
  const btn = document.getElementById('checkoutBtn');

  if (tg && tg.initData && API_URL) {
    btn.disabled = true; btn.textContent = t('sending');
    fetch(API_URL + '/order', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ initData: tg.initData, text: orderText }),
    }).then(r => {
      if (!r.ok) throw new Error('bad status');
      cart = {}; renderGrid(); renderCartUI(); closeDrawer();
      tg.showAlert(t('ok'), () => tg.close());
    }).catch(() => {
      btn.disabled = false; btn.textContent = t('checkout');
      tg.showAlert(t('fail'));
    });
  } else if (tg && tg.sendData) {
    tg.sendData(JSON.stringify(payload));
    tg.close();
  } else {
    const url = 'https://t.me/share/url?url=&text=' + encodeURIComponent(orderText);
    window.open(url, '_blank');
  }
};

// ---- Mahsulot oynasi (xususiyatlar)
const sheet = document.getElementById('sheet');
const sheetOverlay = document.getElementById('sheetOverlay');
let sheetId = null;
function openSheet(id) {
  const p = PRODUCTS.find(x => x.id === id);
  if (!p) return;
  sheetId = id;
  const specs = (p.specs || []).map(([k, v]) => `<div class="spec-row"><span>${tr(k)}</span><span>${tr(v)}</span></div>`).join('');
  document.getElementById('sheetBody').innerHTML = `
    ${p.img ? `<div class="sheet-img"><img src="${p.img}" alt="${tr(p.name)}"></div>` : `<div class="sheet-img icon">${ICONS[p.icon]}</div>`}
    <div class="sheet-brand">${p.brand}</div>
    <h2 class="sheet-name">${tr(p.name)}</h2>
    <div class="sheet-price">${fmt(p.price)}</div>
    ${specs ? `<div class="specs">${specs}</div>` : ''}`;
  sheetOverlay.classList.add('open'); sheet.classList.add('open');
}
function closeSheet() { sheetOverlay.classList.remove('open'); sheet.classList.remove('open'); }
sheetOverlay.onclick = closeSheet;
document.getElementById('sheetAdd').onclick = () => {
  cart[sheetId] = (cart[sheetId] || 0) + 1;
  renderGrid(); renderCartUI(); closeSheet();
  if (tg) tg.HapticFeedback.impactOccurred('light');
};

// ---- Til tanlash
const langSheet = document.getElementById('langSheet');
const langOverlay = document.getElementById('langOverlay');
let pendingLang = lang;
function renderLangOptions() {
  const list = document.getElementById('langList');
  list.innerHTML = LANGS.map(l => `<div class="lang-opt ${l.id === pendingLang ? 'sel' : ''}" data-l="${l.id}"><span>${l.label}</span><span class="tick">✓</span></div>`).join('');
  list.querySelectorAll('.lang-opt').forEach(o => o.onclick = () => { pendingLang = o.dataset.l; renderLangOptions(); });
}
function openLang() { pendingLang = lang; renderLangOptions(); langOverlay.classList.add('open'); langSheet.classList.add('open'); }
function closeLang() { langOverlay.classList.remove('open'); langSheet.classList.remove('open'); }
document.getElementById('langBtn').onclick = openLang;
langOverlay.onclick = closeLang;
document.getElementById('langSave').onclick = () => {
  lang = pendingLang;
  try { localStorage.setItem('ts_lang', lang); } catch (e) {}
  applyLang(); closeLang();
};
function applyLang() {
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach(el => { el.innerHTML = t(el.dataset.i18n); });
  document.getElementById('langCode').textContent = LANGS.find(l => l.id === lang).short;
  renderCats(); renderGrid(); renderCartUI();
  if (sheet.classList.contains('open') && sheetId) openSheet(sheetId);
}
applyLang();
</script>
</body>
